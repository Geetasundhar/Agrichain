<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyer Profile - AgriChain</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/i18next@22.4.9/i18next.min.js"></script>
<script src="https://unpkg.com/i18next-browser-languagedetector@7.2.1/i18nextBrowserLanguageDetector.min.js"></script>

<style>
* {
  margin: 0; padding: 0; box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
body {
  background-color: #f5f7f5;
}

/* Header */
header {
  background: #19692c;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: white;
}
header img { height: 60px; border-radius: 10px; }
nav { display: flex; gap: 20px; }
nav a {
  text-decoration: none;
  color: #f3f7f4;
  font-weight: 600;
  transition: .3s;
}
nav a:hover { color: #ffeaa7; transform: scale(1.1); }
.language-toggle button {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  background: #fff;
  color: #19692c;
  font-weight: bold;
  cursor: pointer;
  margin-left: 5px;
}
.language-toggle button:hover { background: #19692c; color: #fff; }

/* Profile Layout */
.container {
  width: 90%;
  max-width: 1200px;
  margin: 40px auto;
  background: #fff;
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  display: flex;
  gap: 50px;
}
.profile-left {
  flex: 1;
  text-align: center;
  border-right: 2px solid #e0e0e0;
  padding-right: 30px;
}
.profile-left img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #27ae60;
}
.profile-left h3 {
  margin-top: 10px;
  color: #19692c;
}
.profile-left .info {
  background: #f3f7f4;
  border-radius: 10px;
  margin: 10px 0;
  padding: 8px;
  text-align: left;
}
.profile-left .info strong {
  color: #19692c;
}

/* Profile Right */
.profile-right {
  flex: 2;
}
.profile-right h3 {
  color: #19692c;
  margin-bottom: 15px;
  font-size: 1.5rem;
}
.form-group {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
}
.form-group label {
  color: #19692c;
  font-weight: bold;
  flex: 1;
}
.form-group input {
  flex: 2;
  padding: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
  outline: none;
}
.form-group input:focus {
  border-color: #27ae60;
}
.btn-container {
  text-align: center;
  margin-top: 20px;
}
.btn {
  padding: 10px 20px;
  background: #27ae60;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
.btn:hover { background: #19692c; }

/* Footer */
footer {
  background: #19692c;
  color: white;
  text-align: center;
  padding: 12px;
  font-weight: bold;
  margin-top: 30px;
}
</style>
</head>

<body>

<header>
  <img src="../../images/logo.png" alt="Logo">
  <nav>
    <a href="../../index.html" data-i18n="nav-home">Home</a>
    <a href="../buyer/buyer_dashboard.html" data-i18n="nav-dashboard">Dashboard</a>
    <a href="#" data-i18n="nav-profile">Profile</a>
    <a href="../buyer/buyer-login.html" data-i18n="nav-logout">Logout</a>
  </nav>
  <div class="language-toggle">
    <button onclick="changeLng('en')">EN</button>
    <button onclick="changeLng('ta')">TA</button>
  </div>
</header>

<h2 style="text-align:center; color:#19692c; margin-top:30px; font-size:2rem;" data-i18n="profile-title">Buyer Profile</h2>

<div class="container">
  <div class="profile-left">
    <img id="profileImage" src="../../images/default-avatar.png" alt="Profile Image">
    <h3 id="buyerName">--</h3>

    <div class="info"><strong>Email:</strong> <span id="email">--</span></div>
    <div class="info"><strong>Phone:</strong> <span id="phone">--</span></div>
    <div class="info"><strong>District:</strong> <span id="district">--</span></div>
  </div>

  <div class="profile-right">
    <h3>Profile Information</h3>

    <div class="form-group">
      <label>Full Name:</label>
      <input type="text" id="buyer_name" readonly>
    </div>

    <div class="form-group">
      <label>Business Name:</label>
      <input type="text" id="business_name" readonly>
    </div>

    <div class="form-group">
      <label>Username:</label>
      <input type="text" id="username" readonly>
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input type="text" id="emailInput" readonly>
    </div>

    <div class="form-group">
      <label>Phone:</label>
      <input type="text" id="phoneInput" readonly>
    </div>

    <div class="form-group">
      <label>District:</label>
      <input type="text" id="districtInput" readonly>
    </div>

    <div class="btn-container">
      <button class="btn" onclick="window.location.href='buyer-edit.html'">Edit Profile</button>
    </div>
  </div>
</div>

<footer>© 2025 AgriChain. All Rights Reserved.</footer>

<script>
/* 🌐 i18next setup */
const resources = {
  en: { translation: {
    "nav-home":"Home","nav-dashboard":"Dashboard","nav-profile":"Profile","nav-logout":"Logout",
    "profile-title":"Buyer Profile"
  }},
  ta: { translation: {
    "nav-home":"முகப்பு","nav-dashboard":"டாஷ்போர்டு","nav-profile":"சுயவிவரம்","nav-logout":"வெளியேறு",
    "profile-title":"வாங்குபவர் சுயவிவரம்"
  }}
};
i18next.use(i18nextBrowserLanguageDetector).init({ resources, fallbackLng: "en" }, ()=>updateTexts());
function changeLng(l){ i18next.changeLanguage(l, updateTexts); }
function updateTexts(){ document.querySelectorAll("[data-i18n]").forEach(el=>el.innerHTML=i18next.t(el.getAttribute("data-i18n"))); }

/* 🧩 Load Buyer Profile */
async function loadBuyerProfile() {
  const buyerId = localStorage.getItem("buyer_id");
  const token = localStorage.getItem("buyer_token");

  if (!buyerId || !token) {
    alert("Please login first!");
    window.location.href = "../buyer/buyer-login.html";
    return;
  }

  try {
    const res = await fetch(`http://localhost:8000/buyer/profile/${buyerId}`, {
      headers: { "Authorization": `Bearer ${token}` }
    });

    const data = await res.json();
    console.log("✅ Buyer Profile Response:", data);

    if (data.status === "success" && data.buyer) {
      const b = data.buyer;
      document.getElementById("buyerName").textContent = b.buyer_name || "";
      document.getElementById("buyer_name").value = b.buyer_name || "";
      document.getElementById("business_name").value = b.business_name || "";
      document.getElementById("district").textContent = b.district || "";
      document.getElementById("districtInput").value = b.district || "";
      document.getElementById("phone").textContent = b.phone || "";
      document.getElementById("phoneInput").value = b.phone || "";
      document.getElementById("email").textContent = b.email || "";
      document.getElementById("emailInput").value = b.email || "";
      document.getElementById("username").value = b.username || "";
      if (b.profile_image) {
        document.getElementById("profileImage").src = `http://localhost:5000${b.profile_image}`;
      }
    } else {
      alert("Failed to load profile. Please login again.");
      window.location.href = "../buyer/buyer-login.html";
    }
  } catch (err) {
    console.error("❌ Error loading profile:", err);
    alert("Server error. Please try again later.");
  }
}
loadBuyerProfile();
</script>

</body>
</html>
